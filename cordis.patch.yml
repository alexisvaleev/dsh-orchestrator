# Orchestrator bundle patch: mounts the dual-face `dsh-orchestrator` plugin.
# The host entry registers the `orchestrator` Remote namespace, the
# `orchestrate` tool, and the worktree-bound run engine; the package's
# `dsh.client` declaration advertises the sidebar panel under the same row.
insert:
  - id: orchestrator
    name: dsh-orchestrator
    config:
      # Comma-separated provider names whose models the planner may route to,
      # e.g. `DSH_ORCHESTRATOR_PROVIDERS=devin,deepseek-official`. Empty means
      # "inherit the session route".
      routeProviders: !!js (process.env.DSH_ORCHESTRATOR_PROVIDERS ?? '').split(',').map(s => s.trim()).filter(Boolean)
